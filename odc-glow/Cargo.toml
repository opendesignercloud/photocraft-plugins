[package]
name = "odc-glow"
description = "ODC Glow: a PhotoCraft WebAssembly filter plug-in (Orton, glamour glow, soft focus, haze)"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Builds for wasm32-unknown-unknown only; not part of any workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
