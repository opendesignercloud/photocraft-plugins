[package]
name = "odc-film-look"
description = "ODC Film Look: a PhotoCraft WebAssembly filter plug-in (film looks, grain, vignette, faded blacks, warmth)"
version = "2.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Builds for wasm32-unknown-unknown only; not part of any workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
