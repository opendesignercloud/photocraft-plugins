name: build

on:
  push:
    branches: [main]
    tags: ['odc-film-look-v*', 'odc-lens-v*', 'odc-glow-v*', 'odc-tone-v*']
  pull_request:

permissions:
  contents: write   # to attach the .wasm to a release

jobs:
  odc-film-look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust with the WebAssembly target
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
      - name: Build
        run: ./build.sh
        working-directory: odc-film-look
      - uses: actions/upload-artifact@v4
        with:
          name: odc-film-look.wasm
          path: odc-film-look/dist/odc-film-look.wasm
      # A tag such as odc-film-look-v2.0.0 publishes a GitHub Release with the .wasm attached.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/odc-film-look-v')
        run: >
          gh release create "$GITHUB_REF_NAME" odc-film-look/dist/odc-film-look.wasm
          --title "ODC Film Look ${GITHUB_REF_NAME#odc-film-look-v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  odc-lens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust with the WebAssembly target
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
      - name: Build
        run: ./build.sh
        working-directory: odc-lens
      - uses: actions/upload-artifact@v4
        with:
          name: odc-lens.wasm
          path: odc-lens/dist/odc-lens.wasm
      # A tag such as odc-lens-v1.0.0 publishes a GitHub Release with the .wasm attached.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/odc-lens-v')
        run: >
          gh release create "$GITHUB_REF_NAME" odc-lens/dist/odc-lens.wasm
          --title "ODC Lens ${GITHUB_REF_NAME#odc-lens-v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  odc-glow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust with the WebAssembly target
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
      - name: Build
        run: ./build.sh
        working-directory: odc-glow
      - uses: actions/upload-artifact@v4
        with:
          name: odc-glow.wasm
          path: odc-glow/dist/odc-glow.wasm
      # A tag such as odc-glow-v1.0.0 publishes a GitHub Release with the .wasm attached.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/odc-glow-v')
        run: >
          gh release create "$GITHUB_REF_NAME" odc-glow/dist/odc-glow.wasm
          --title "ODC Glow ${GITHUB_REF_NAME#odc-glow-v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  odc-tone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust with the WebAssembly target
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
      - name: Build
        run: ./build.sh
        working-directory: odc-tone
      - uses: actions/upload-artifact@v4
        with:
          name: odc-tone.wasm
          path: odc-tone/dist/odc-tone.wasm
      # A tag such as odc-tone-v1.0.0 publishes a GitHub Release with the .wasm attached.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/odc-tone-v')
        run: >
          gh release create "$GITHUB_REF_NAME" odc-tone/dist/odc-tone.wasm
          --title "ODC Tone ${GITHUB_REF_NAME#odc-tone-v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
