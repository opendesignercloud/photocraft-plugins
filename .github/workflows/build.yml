name: build

on:
  push:
    branches: [main]
    tags: ['odc-film-look-v*']
  pull_request:

permissions:
  contents: write   # to attach the .wasm to a release

jobs:
  odc-film-look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust with the WebAssembly target
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
      - name: Build
        run: ./build.sh
        working-directory: odc-film-look
      - uses: actions/upload-artifact@v4
        with:
          name: odc-film-look.wasm
          path: odc-film-look/dist/odc-film-look.wasm
      # A tag such as odc-film-look-v2.0.0 publishes a GitHub Release with the .wasm attached.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/odc-film-look-v')
        run: >
          gh release create "$GITHUB_REF_NAME" odc-film-look/dist/odc-film-look.wasm
          --title "ODC Film Look ${GITHUB_REF_NAME#odc-film-look-v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
